apiVersion: apps/v1
kind: Deployment
metadata: {name: microservice-api}
spec:
  replicas: 3
  selector: {matchLabels: {app: microservice-api}}
  template:
    metadata: {labels: {app: microservice-api}}
    spec:
      containers:
      - name: api
        image: ghcr.io/example/cloud-native-microservices-platform:latest
        ports: [{containerPort: 8000}]
        readinessProbe: {httpGet: {path: /ready, port: 8000}}
        livenessProbe: {httpGet: {path: /health, port: 8000}}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: microservice-api}
spec:
  selector: {app: microservice-api}
  ports: [{port: 80, targetPort: 8000}]
